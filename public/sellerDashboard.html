<body class="seller-dashboard" style="background-color: #F9F9FA;">

    <div class="p-3" style="margin-top: 80px !important;">

        <div class="d-flex justify-content-end pe-5">

    <footer class=" px-lg-3 mx-auto text-black mt-4">
        <div
            class="footer-group px-3 px-md-5 py-4 pt-md-5  d-md-flex justify-content-md-center  justify-content-lg-between  gap-md-5 pt-4 ">

            <div class="footer-details px-xl-5 d-md-flex gap-5  ">

                <div class="vite mb-5 me-md-4 text-black">
                    <div class="text-light mb-4"
                        style="color: #827989 !important; font-family: monospace; font-size: 12px !important;"><svg
                            width="130" viewBox="0 0 240 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- DM Icon -->
                            <g transform="translate(10,15)">
                                <path d="M10 10V60H32C48 60 60 48 60 35C60 22 48 10 32 10H10Z" stroke="black"
                                    stroke-width="5" fill="none" stroke-linejoin="round" />
                                <path d="M48 60V10L60 38L72 10V60" stroke="black" stroke-width="5" fill="none"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </g> <text x="105" y="50" font-family="Helvetica, Arial, sans-serif" font-size="22"
                                font-weight="900" letter-spacing="0.8" fill="black"> dínhmart </text>

                            <line x1="105" y1="62" x2="210" y2="62" stroke="black" stroke-width="3" />
                            <circle cx="215" cy="62" r="2.5" fill="black" />
                        </svg></div>
                    <div class="d-grid gap-3" style="font-weight: 200 !important;">
                        <p class="text-decoration-none text-black" href="">Your trusted multi-vendor marketplace for
                            quality products from sellers worldwide.</p>
                    </div>
                </div>

                <div class="resources mb-5 me-md-4 ">
                    <p class="text-light mb-4"
                        style="color: #827989 !important; font-family: monospace; font-size: 12px !important;">ABOUT US
                    </p>
                    <div class="d-grid gap-3" style="font-weight: 200 !important;">
                        <a class="text-decoration-none text-black" href="">How it works</a>

                <div class="versions mb-5 me-md-4 text-black">

                    <div class="d-grid gap-3" style="font-weight: 200 !important;">

                    </div>

            </div>



            <div class="footer-social-accounts mb-5 px-xl-5 text-black ">
                <p class="text-light mb-4"
                    style="color: #827989 !important; font-family: monospace; font-size: 12px !important; font-weight: lighter; ">
                    SOCIAL</p>
                <div class="d-grid gap-3" style="font-weight: 200 !important;">
                    <a class="text-decoration-none text-black d-flex align-items-center gap-3 " href="">
                        <img height="22" src="vite/download (3).svg" alt="">
                        <span>Github</span>
                    </a>
                    <a class="text-decoration-none text-black d-flex align-items-center gap-3" href="">
                        <img height="22" src="vite/download (6).svg" alt="">
                        <span>Discord</span>
                    </a>
                    <a class="text-decoration-none text-black d-flex align-items-center gap-3" href="">
                        <img height="22" src="vite/download (7).svg" alt="">
                        <span>Bluesky</span>
                    </a>
                    <a class="text-decoration-none text-black d-flex align-items-center gap-3" href="">
                        <img height="22" src="vite/download (8).svg" alt="">
                        <span>X.com</span>
                    </a>
                </div>
            </div>



        </div>

        <div class="px-3 px-md-5 py-3 " style="background-color: #F9F9FA;">
            <p class=" px-md-4 text-white text-center" style="color: #827989 !important; font-size: 14px;">&#169 2025
                DínMart.
                All right Reserved</p>
        </div>
    </footer>
    <script type="module">
        import User from "/User.js";
        import { escapeAttribute, escapeHtml, safeImageUrl } from "/sanitize.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDtme28j9rc5NIbv7mHOSncV9W_6NlGWp4",
            authDomain: "chicmart-9c9f1.firebaseapp.com",
            databaseURL: "https://chicmart-9c9f1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chicmart-9c9f1",
            storageBucket: "chicmart-9c9f1.firebasestorage.app",
            messagingSenderId: "860959606353",
            appId: "1:860959606353:web:0744c14db06445b109da70"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth();

        const db = getDatabase(app);

        const containsMarkup = (value) => /[<>]/.test(value);

        let prodIndex = 0;


      
        onAuthStateChanged(auth, (user) => {
            if (user) {
            
                const uid = user.uid;
                const userEmail = user.email;

                console.log(uid);

                // Fetch seller details from database
                if (userEmail) {
                    const sellerRef = ref(db, `sellers/${userEmail.replace(/\./g, '_')}`);
                    get(sellerRef)
                        .then((snapshot) => {
                            if (snapshot.exists()) {
                                const sellerData = snapshot.val();
                            
                                localStorage.setItem("sellerData", JSON.stringify(sellerData));
                                updateUserHeader(sellerData);
                            }
                        })
                        .catch((error) => {
                            console.log("Error fetching seller data:", error);
                        });
                }

            
            } else {
                window.location.href = "/";
            }
        });

      
        document.getElementById("signOut").addEventListener("click", () => {
            signOut(auth).then(() => {
                alert("Signed out successfully");
                window.location.href = "/";
            }).catch((error) => {
             
                console.log(error);
                alert("Error signing out: " + error.message);
            });
        });


        const updateUserHeader = (sellerData) => {
            const getUser = localStorage.getItem("user");
            const convertuser = getUser ? JSON.parse(getUser) : null;
            let welcomeName = "Seller";

            if (sellerData?.source === "form") {
                welcomeName = sellerData.shopName || convertuser?.fullname || "Seller";
            } else if (sellerData?.source === "google") {
                welcomeName = convertuser?.fullname || sellerData?.firstName || sellerData?.shopName || "Seller";
            } else {
                welcomeName = sellerData?.shopName || convertuser?.fullname || "Seller";
            }

            const profilePicture = convertuser?.picture || "https://via.placeholder.com/50?text=U";

            currentuser.innerHTML = `
                <div class="d-flex align-items-center gap-2">
                    <div>
                        <img class="rounded-5" src="${safeImageUrl(profilePicture)}" alt="" width="50" height="50">
                    </div>
                    <div>
                        <p class="fw-bold mt-3" style="font-weight:600 !important">Profile</p>
                    </div>
                </div>
            `;

            greetings.textContent = `WELCOME, ${welcomeName}`;
        };

        const storedSellerData = localStorage.getItem("sellerData");
        const initialSellerData = storedSellerData ? JSON.parse(storedSellerData) : null;
        updateUserHeader(initialSellerData);

       

        
        document.getElementById("addProduct")
            .addEventListener("click", () => {

                productForm.innerHTML = `

                <div class="d-flex flex-column gap-2 ">

                    <input required id="productImage"type="text"placeholder="Product Image URL"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;" >
                 
                    <input required  id="productName" type="text"placeholder="Product Name"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">
                   
                    <input required   id="productPrice" type="number" placeholder="Product Price"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">

                    <input required id="productQuantity"type="number"placeholder="Product Quantity"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">

                   
                    <select required class="rouned-2"  name="" id="productCategory"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">
                        <option value="">Select Category</option>
                         <option value="beauty">beuty</option>
                          <option value="furniture">furniture</option>
                           <option value="fragrances">fragrances</option>
                           <option value="groceries">groceries</option>
                           <option value="phone">phone</option>
                           <option value="laptop">laptop</option>
                    </select>

                    <textarea required  id="productDescription"placeholder="Product Description" style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;"></textarea  >

                    <button  id="saveProduct" style="background-color: black; color: white; border: none !important; padding: 5px 11px !important; max-width: 200px; border-radius: 5px;"> Save Product</button>

                </div>
            `;

              
                document.getElementById("saveProduct").addEventListener("click", () => {
                   
                    const imageValue = productImage.value.trim();
                    const nameValue = productName.value.trim();
                    const priceValue = productPrice.value.trim();
                    const quantityValue = productQuantity.value.trim();
                    const categoryValue = productCategory.value.trim();
                    const descriptionValue = productDescription.value.trim();

                   
                    if (
                        imageValue === "" ||
                        nameValue === "" ||
                        priceValue === "" ||
                        quantityValue === "" ||
                        categoryValue === "" ||
                        descriptionValue === ""
                    ) {
                        alert("Please fill all product details");
                        return;
                    }

                    if ([imageValue, nameValue, priceValue, quantityValue, categoryValue, descriptionValue].some(containsMarkup)) {
                        alert("HTML tags are not allowed in product details. Use plain text only.");
                        return;
                    }


                    const dbRef = ref(db, `/products/${prodIndex}`);
                    const sellerData = localStorage.getItem("sellerData") ? JSON.parse(localStorage.getItem("sellerData")) : {};
                    console.log("sellerData from localStorage:", sellerData);
                    console.log("sellerData.shopName:", sellerData.shopName);
                    
                    let productData = {

                        productImage: productImage.value,
                        productName: productName.value,
                        productPrice: productPrice.value,
                        productQuantity: productQuantity.value,
                        productCategory: productCategory.value,
                        productDescription: productDescription.value,
                        id: auth.currentUser.uid,
                        email: auth.currentUser.email,
                        name: auth.currentUser.displayName,
                        shopName: sellerData.shopName || auth.currentUser.displayName,
                        role: "seller"
                    };
                    
                    console.log("productData being saved:", productData);


                    // saving to database
                    set(dbRef, productData)
                        .then(() => {

                         
                            const alertMe = document.getElementById("messageAlert");

                            alertMe.style.display = "block";

                            alertMe.innerHTML = `
                            <div class="alert alert-success text-center">
                                Product Saved Successfully!
                            </div>
                        `;


                            setTimeout(() => {
                                alertMe.innerHTML = "";
                            }, 3000);

                            
                            productForm.innerHTML = "";

                        })

                        .catch((error) => {
                            console.log(error);
                            alert("Error saving product");
                        });



                });
            });




        //reading from the database


        const dbRef = ref(db, "/products");

        onValue(dbRef, (snapshot) => {

            const data = snapshot.val();

            console.log(data);


            if (!data) {
                prodIndex = 0;
                productList.innerHTML = `
                    <h3>No products yet</h3>
                `;
            } else {
                const productEntries = Array.isArray(data)
                    ? data.map((item, idx) => [idx, item])
                    : Object.entries(data);

                prodIndex = Array.isArray(data)
                    ? data.length
                    : productEntries.reduce((nextIndex, [key]) => {
                        const numericKey = Number(key);
                        return Number.isFinite(numericKey) ? Math.max(nextIndex, numericKey + 1) : nextIndex;
                    }, productEntries.length);

                productList.innerHTML = "";
                productEntries.forEach(([idx, item]) => {
                    if (!item) return;
                    if (auth.currentUser && auth.currentUser.email == item.email) {

                        productList.innerHTML += `

                        <div class="card" style="width: 250px" data-idx="${idx}">
                            <img src="${safeImageUrl(item.productImage)}" class="card-img-top" alt="${escapeAttribute(item.productName)}" height="250"  style="object-fit: cover;">
                            <div class="card-body p-2" style="display:flex !important; flex-direction:column !important; ">
                                <h5 class="card-title">${escapeHtml(item.productName)}</h5>
                                <div class="d-flex justify-content-between align-items-center">
                                    <p>₦${escapeHtml(item.productPrice)}</p>
                                    <p>Qty:${escapeHtml(item.productQuantity)}</p>
                                </div>
                                <p class="card-text" style="flex: 1 !important">${escapeHtml(item.productDescription)}</p>
                                <div>
                                    <a href="#" class="btn px-2 py-1 btn-primary editBtn" data-idx="${idx}">Edit</a>
                                    <a href="#" class="btn px-2 py-1 btn-danger deleteBtn" data-idx="${idx}">Delete</a>
                                </div>
                                
                            </div>
                        </div>
                    `;
                    }

                });

            }

        });

        productList.addEventListener("click", (e) => {
            e.preventDefault();

            if (e.target.classList.contains("editBtn")) {
                const idx = e.target.getAttribute("data-idx");
                const dbRef = ref(db, "/products");

                onValue(dbRef, (snapshot) => {
                    const data = snapshot.val();
                    
                   
                    let item = null;
                    if (data) {
                        if (Array.isArray(data)) {
                            item = data[idx];
                        } else {
                            item = data[idx];
                        }
                    }
                    
                    if (item) {
                        productForm.innerHTML = `

                <div class="d-flex flex-column gap-2 ">

                    <input required id="productImage"type="text" value="${escapeAttribute(item.productImage)}" placeholder="Product Image URL"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;" >
                 
                    <input required  id="productName" type="text" value="${escapeAttribute(item.productName)}" placeholder="Product Name"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">
                   
                    <input required   id="productPrice"type="text" value="${escapeAttribute(item.productPrice)}" placeholder="Product Price"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">

                    <input required id="productQuantity"type="number" value="${escapeAttribute(item.productQuantity)}" placeholder="Product Quantity"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">

                   
                    <select required class="rouned-2"  name="" id="productCategory"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">
                        <option value="">Select Category</option>
                         <option value="beauty" ${item.productCategory === 'beauty' ? 'selected' : ''}>beauty</option>
                          <option value="furniture" ${item.productCategory === 'furniture' ? 'selected' : ''}>furniture</option>
                           <option value="fragrances" ${item.productCategory === 'fragrances' ? 'selected' : ''}>fragrances</option>
                           <option value="groceries" ${item.productCategory === 'groceries' ? 'selected' : ''}>groceries</option>
                           <option value="phone" ${item.productCategory === 'phone' ? 'selected' : ''}>phone</option>
                           <option value="laptop" ${item.productCategory === 'laptop' ? 'selected' : ''}>laptop</option>
                    </select>

                    <textarea required  id="productDescription" placeholder="Product Description" style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">${escapeHtml(item.productDescription)}</textarea  >

                    <button  id="updateProduct" data-idx="${idx}" style="background-color: #28a745; color: white; border: none !important; padding: 5px 11px !important; max-width: 200px; border-radius: 5px;"> Update Product</button>
                    <button  id="cancelEdit" style="background-color: #6c757d; color: white; border: none !important; padding: 5px 11px !important; max-width: 200px; border-radius: 5px;"> Cancel</button>

                </div>
            `;

                        // UPDATE PRODUCT
                        document.getElementById("updateProduct").addEventListener("click", async () => {
                            const imageValue = productImage.value.trim();
                            const nameValue = productName.value.trim();
                            const priceValue = productPrice.value.trim();
                            const quantityValue = productQuantity.value.trim();
                            const categoryValue = productCategory.value.trim();
                            const descriptionValue = productDescription.value.trim();

                            if ([imageValue, nameValue, priceValue, quantityValue, categoryValue, descriptionValue].some(containsMarkup)) {
                                alert("HTML tags are not allowed in product details. Use plain text only.");
                                return;
                            }

                            if (
                                imageValue === "" ||
                                nameValue === "" ||
                                priceValue === "" ||
                                quantityValue === "" ||
                                categoryValue === "" ||
                                descriptionValue === ""
                            ) {
                                alert("Please fill all product details");
                                return;
                            }

                            const updateRef = ref(db, `/products/${idx}`);
                            const updatedProductData = {
                                productImage: imageValue,
                                productName: nameValue,
                                productPrice: priceValue,
                                productQuantity: quantityValue,
                                productCategory: categoryValue,
                                productDescription: descriptionValue,
                                id: auth.currentUser.uid,
                                email: auth.currentUser.email,
                                name: auth.currentUser.displayName,
                                role: "seller"
                            }; 

                            set(updateRef, updatedProductData)
                                .then(() => {
                                    const alertMe = document.getElementById("messageAlert");
                                    alertMe.style.display = "block";
                                    alertMe.innerHTML = `
                            <div class="alert alert-success text-center">
                                Product Updated Successfully!
                            </div>
                        `;
                                    setTimeout(() => {
                                        alertMe.innerHTML = "";
                                    }, 3000);
                                    productForm.innerHTML = "";
                                })
                                .catch((error) => {
                                    console.log(error);
                                    alert("Error updating product");
                                });
                        });

                       
                        document.getElementById("cancelEdit").addEventListener("click", () => {
                            productForm.innerHTML = "";
                        });
                    }
                }, { onlyOnce: true });
            }

            if (e.target.classList.contains("deleteBtn")) {
                const idx = e.target.getAttribute("data-idx");
                if (confirm("Are you sure you want to delete this product?")) {
                    const deleteRef = ref(db, `/products/${idx}`);
                    set(deleteRef, null)
                        .then(() => {
                            const alertMe = document.getElementById("messageAlert");
                            alertMe.style.display = "block";
                            alertMe.innerHTML = `
                        <div class="alert alert-danger text-center">
                            Product Deleted Successfully!
                        </div>
                    `;
                            setTimeout(() => {
                                alertMe.innerHTML = "";
                            }, 3000);
                        })
                        .catch((error) => {
                            console.log(error);
                            alert("Error deleting product");
                        });
                }
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>
