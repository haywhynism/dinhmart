<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buyerDashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Cart Sidebar Styles */
        #cartSidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 1050;
            display: flex;
            flex-direction: column;
        }

        #cartSidebar.active {
            transform: translateX(0);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 2px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .cart-header h3 {
            margin: 0;
            font-weight: 600;
        }

        .close-cart {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        #cartItemsContainer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .cart-item-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
        }

        .cart-item-details {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
        }

        .cart-item-price {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .qty-control button {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-control input {
            width: 50px;
            height: 28px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
            font-weight: 600;
        }

        .cart-item-total {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .remove-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .remove-btn:hover {
            background: #ff5252;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .cart-footer {
            border-top: 2px solid #f0f0f0;
            padding: 20px;
            background: #f9f9f9;
        }

        .cart-summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
            color: #666;
        }

        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 16px;
        }

        .checkout-btn:hover {
            opacity: 0.9;
        }

        .cart-overlay {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            z-index: 1040;
        }

        .cart-overlay.active {
            display: block;
        }
    </style>
</head>

<body style="background-color: #F9F9FA;">

    <header class=" px-3 py-3" style="background-color: white; box-shadow: 1px 1px 3px 1px #e5e5e5">
        <div class="d-flex justify-content-between align-items-center">
            <div class="logoImg">
                <svg width="130" viewBox="0 0 240 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- DM Icon -->
                    <g transform="translate(10,15)">
                        <path d="M10 10V60H32C48 60 60 48 60 35C60 22 48 10 32 10H10Z" stroke="black" stroke-width="5"
                            fill="none" stroke-linejoin="round" />
                        <path d="M48 60V10L60 38L72 10V60" stroke="black" stroke-width="5" fill="none"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </g> <text x="105" y="50" font-family="Helvetica, Arial, sans-serif" font-size="22"
                        font-weight="900" letter-spacing="0.8" fill="black"> dínhmart </text>

                    <line x1="105" y1="62" x2="210" y2="62" stroke="black" stroke-width="3" />
                    <circle cx="215" cy="62" r="2.5" fill="black" />
                </svg>
            </div>

            <div>
                <input id="searchInput" class="rounded-5 py-2 px-3" type="search" placeholder="search here...."
                    style="border: 1px solid #d1cfcf; width: 450px;">
            </div>

            <div class="d-none ">
                <a href="index.html" class="text-decoration-none text-dark" style="font-weight: 500;">Home</a>
                <a href="index.html" class="text-decoration-none text-dark" style="font-weight: 500;">Carts</a>
                <a href="" class="text-decoration-none text-dark" style="font-weight: 500;">About</a>
                <a href="" class="text-decoration-none text-dark" style="font-weight: 500;">Contact</a>
            </div>

            <div class=" d-flex gap-4 me-3 align-items-center">
                <div id="currentuser" class="d-flex  align-items-center gap-4">
                </div>

                <!-- Cart Icon -->
                <div style="position: relative; cursor: pointer;" id="cartIcon">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    <span id="cartCount" style="position: absolute; top: -8px; right: -8px; background-color: red; color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold;">0</span>
                </div>

                <button class="rounded-2" id="signOut"
                    style="background-color: black; color: white; border: none !important; padding: 5px 11px !important ;">Sign
                    Out</button>

            </div>


        </div>
    </header>

    <div class="p-4">
        <h1>All Products</h1>

        <div id="messageAlert"></div>

        <div class=" gap-3" id="productList"
            style=" display: flex !important; flex-wrap: wrap !important; justify-content: stretch; overflow: hidden !important; "></div>

    </div>

    <!-- Cart Sidebar -->
    <div class="cart-overlay" id="cartOverlay"></div>
    <div id="cartSidebar">
        <div class="cart-header">
            <h3>Shopping Cart</h3>
            <button class="close-cart" id="closeCart">&times;</button>
        </div>
        <div id="cartItemsContainer" class="empty-cart">
            Your cart is empty
        </div>
        <div class="cart-footer">
            <div class="cart-summary">
                <span>Subtotal:</span>
                <span>₦<span id="cartSubtotal">0</span></span>
            </div>
            <div class="cart-summary">
                <span>Shipping:</span>
                <span>Free</span>
            </div>
            <div class="cart-total">
                <span>Total:</span>
                <span>₦<span id="cartFinalTotal">0</span></span>
            </div>
            <button class="checkout-btn" id="buyNowBtn">Proceed to Checkout</button>
        </div>
    </div>


    <script type="module">
        import User from "/User.js"
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDtme28j9rc5NIbv7mHOSncV9W_6NlGWp4",
            authDomain: "chicmart-9c9f1.firebaseapp.com",
            databaseURL: "https://chicmart-9c9f1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chicmart-9c9f1",
            storageBucket: "chicmart-9c9f1.firebasestorage.app",
            messagingSenderId: "860959606353",
            appId: "1:860959606353:web:0744c14db06445b109da70"
        };


        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getDatabase(app);
        const buyerDetails = ""

        // // CHECK USER LOGIN
        onAuthStateChanged(auth, (user) => {
            if (user) {
                

                const uid = user.uid;

                console.log(uid);

                // ...
            } else {
                window.location.href = "/";
            }
        });

         // USER SIGNOUT
        document.getElementById("signOut").addEventListener("click", () => {
            signOut(auth).then(() => {
                alert("Signed out successfully");
                window.location.href = "/";
            }).catch((error) => {
                // An error happened.
                console.log(error);
                alert("Error signing out: " + error.message);
            });
        });

        // User account details
        let getUser = localStorage.getItem("user");
        let convertuser = JSON.parse(getUser);

        console.log(auth.currentUser);

        const dbRef = ref(db, "/products");
        let allProducts = [];  // Store all products for filtering

        onValue(dbRef, (snapshot) => {

            const data = snapshot.val();

            console.log(data);

            allProducts = data;  // Store products globally for search
            displayProducts(data);  // Display all products initially

        });

        // DISPLAY PRODUCTS FUNCTION
        function displayProducts(productsToDisplay) {
            productList.innerHTML = "";
            productsToDisplay.map((item, idx) => {
                productList.innerHTML += `

                        <div class="card" style="width: 250px">
                            <img src="${item.productImage}" class="card-img-top" alt="..." height="250"  style="object-fit: cover;">
                            <div class="card-body p-2" style="display:flex !important; flex-direction:column !important; ">
                                <h5 class="card-title">${item.productName}</h5>
                                <div class="d-flex justify-content-between align-items-center">
                                    <p>₦${item.productPrice}</p>
                                    <p>Qty:${item.productQuantity}</p>
                                </div>
                                <p class="card-text" style="flex: 1 !important">${item.productDescription}</p>

                                <div class="d-flex justify-content-between; gap-2">
                                    <p style="font-size:12px !important">posted by: ${item.name}</p>

                                    <a href="#" class="btn px-2 py-1 addToCart" data-idx="${idx}" data-product='${JSON.stringify(item)}' style="background-color: orange; color:white; font-size: 12px !important">cart</a>
                                </div>
                                
                            </div>
                        </div>
                    `;
            })
        }

        // SEARCH FUNCTIONALITY
        document.getElementById("searchInput").addEventListener("keyup", (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();

            if (searchTerm === "") {
                // If search is empty, display all products
                displayProducts(allProducts);
            } else {
                // Filter products based on search term
                const filteredProducts = allProducts.filter(item => {
                    if (!item) return false;
                    return (
                        item.productName.toLowerCase().includes(searchTerm) ||
                        item.productPrice.includes(searchTerm)
                    );
                });

                displayProducts(filteredProducts);

                if (filteredProducts.length === 0) {
                    productList.innerHTML = `<h5>No products found matching "${searchTerm}"</h5>`;
                }
            }
        });

        // ADD TO CART FUNCTIONALITY
        productList.addEventListener("click", (e) => {
            e.preventDefault();

            if (e.target.classList.contains("addToCart")) {
                const productData = JSON.parse(e.target.getAttribute("data-product"));

                // Get existing cart from localStorage
                let cart = localStorage.getItem("cart");
                cart = cart ? JSON.parse(cart) : [];

                // Add product to cart
                const existingProduct = cart.find(p => p.productName === productData.productName);

                if (existingProduct) {
                    // If product already in cart, increase quantity
                    existingProduct.quantity += 1;
                    alert(`${productData.productName} quantity updated in cart!`);
                } else {
                    // Add new product to cart with quantity 1
                    cart.push({
                        ...productData,
                        quantity: 1
                    });
                    alert(`${productData.productName} added to cart!`);
                }

                // Save updated cart to localStorage
                localStorage.setItem("cart", JSON.stringify(cart));

                // Update cart count
                updateCartCount();

                // Show success message
                const alertMe = document.getElementById("messageAlert");
                alertMe.style.display = "block";
                alertMe.innerHTML = `
                    <div class="alert alert-success text-center">
                        Product added to cart successfully!
                    </div>
                `;

                setTimeout(() => {
                    alertMe.innerHTML = "";
                }, 2000);
            }
        });

        // UPDATE CART COUNT
        function updateCartCount() {
            let cart = localStorage.getItem("cart");
            cart = cart ? JSON.parse(cart) : [];
            document.getElementById("cartCount").textContent = cart.length;
        }

        // CART ICON CLICK - SHOW CART ITEMS
        document.getElementById("cartIcon").addEventListener("click", () => {
            displayCartItems();
            const cartModal = new bootstrap.Modal(document.getElementById("cartModal"));
            cartModal.show();
        });

        // DISPLAY CART ITEMS IN MODAL
        function displayCartItems() {
            let cart = localStorage.getItem("cart");
            cart = cart ? JSON.parse(cart) : [];

            const cartItemsContainer = document.getElementById("cartItems");
            let totalPrice = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `<p class="text-center">Your cart is empty</p>`;
                document.getElementById("cartTotal").textContent = "0";
                return;
            }

            let cartHTML = `<table class="table">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Qty</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>`;

            cart.forEach((product, idx) => {
                const productTotal = product.productPrice * product.quantity;
                totalPrice += productTotal;

                cartHTML += `
                    <tr>
                        <td>${product.productName}</td>
                        <td>₦${product.productPrice}</td>
                        <td>
                            <input type="number" value="${product.quantity}" min="1" class="form-control" style="width: 60px;" data-idx="${idx}" class="qtyInput">
                        </td>
                        <td>₦${productTotal}</td>
                        <td>
                            <button class="btn btn-danger btn-sm removeFromCart" data-idx="${idx}">Remove</button>
                        </td>
                    </tr>
                `;
            });

            cartHTML += `</tbody></table>`;
            cartItemsContainer.innerHTML = cartHTML;
            document.getElementById("cartTotal").textContent = totalPrice;

            // Remove from cart functionality
            document.querySelectorAll(".removeFromCart").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const idx = e.target.getAttribute("data-idx");
                    let cart = localStorage.getItem("cart");
                    cart = cart ? JSON.parse(cart) : [];
                    cart.splice(idx, 1);
                    localStorage.setItem("cart", JSON.stringify(cart));
                    updateCartCount();
                    displayCartItems();
                });
            });

            // Update quantity
            document.querySelectorAll(".qtyInput").forEach(input => {
                input.addEventListener("change", (e) => {
                    const idx = e.target.getAttribute("data-idx");
                    const newQty = parseInt(e.target.value);
                    if (newQty < 1) {
                        alert("Quantity must be at least 1");
                        e.target.value = 1;
                        return;
                    }
                    let cart = localStorage.getItem("cart");
                    cart = cart ? JSON.parse(cart) : [];
                    cart[idx].quantity = newQty;
                    localStorage.setItem("cart", JSON.stringify(cart));
                    displayCartItems();
                });
            });
        }

        // BUY NOW - PAYSTACK PAYMENT
        document.getElementById("buyNowBtn").addEventListener("click", () => {
            let cart = localStorage.getItem("cart");
            cart = cart ? JSON.parse(cart) : [];

            if (cart.length === 0) {
                alert("Your cart is empty");
                return;
            }

            // Calculate total amount in kobo (Paystack uses kobo)
            let totalAmount = 0;
            cart.forEach(product => {
                totalAmount += product.productPrice * product.quantity;
            });

            // Initialize Paystack
            const handler = PaystackPop.setup({
                key: 'pk_test_5ac0c9c8e9f7c3d8e9f7c3d8e9f7c3d8', // Replace with your Paystack public key
                email: auth.currentUser.email,
                amount: totalAmount * 100, // Convert to kobo
                ref: '' + Math.floor((Math.random() * 1000000000) + 1), // Generate unique reference
                onClose: function() {
                    alert('Payment window closed.');
                },
                onSuccess: function(response) {
                    // Payment successful
                    alert('Payment successful! Reference: ' + response.reference);
                    
                    // Clear cart
                    localStorage.setItem("cart", JSON.stringify([]));
                    updateCartCount();
                    
                    // Close modal
                    bootstrap.Modal.getInstance(document.getElementById("cartModal")).hide();
                    
                    // Show success message
                    const alertMe = document.getElementById("messageAlert");
                    alertMe.style.display = "block";
                    alertMe.innerHTML = `
                        <div class="alert alert-success text-center">
                            Payment successful! Your order has been placed.
                        </div>
                    `;
                    setTimeout(() => {
                        alertMe.innerHTML = "";
                    }, 3000);
                }
            });
            handler.openIframe();
        });

        // Initialize cart count on page load
        updateCartCount();

    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    
    <!-- Paystack Script -->
    <script src="https://js.paystack.co/v1/inline.js"></script>

</body>

</html>
