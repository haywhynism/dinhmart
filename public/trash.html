<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-color: #F9F9FA;">


    <header class=" px-3 py-3" style="background-color: white; box-shadow: 1px 1px 3px 1px #e5e5e5">
        <div class="d-flex justify-content-between align-items-center">
            <div class="logoImg">
                <svg width="130" viewBox="0 0 240 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- DM Icon -->
                    <g transform="translate(10,15)">
                        <path d="M10 10V60H32C48 60 60 48 60 35C60 22 48 10 32 10H10Z" stroke="black" stroke-width="5"
                            fill="none" stroke-linejoin="round" />
                        <path d="M48 60V10L60 38L72 10V60" stroke="black" stroke-width="5" fill="none"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </g> <text x="105" y="50" font-family="Helvetica, Arial, sans-serif" font-size="22"
                        font-weight="900" letter-spacing="0.8" fill="black"> dínhmart </text>

                    <line x1="105" y1="62" x2="210" y2="62" stroke="black" stroke-width="3" />
                    <circle cx="215" cy="62" r="2.5" fill="black" />
                </svg>
            </div>

            <div class="d-none ">
                <a href="index.html" class="text-decoration-none text-dark" style="font-weight: 500;">Home</a>
                <a href="index.html" class="text-decoration-none text-dark" style="font-weight: 500;">Carts</a>
                <a href="" class="text-decoration-none text-dark" style="font-weight: 500;">About</a>
                <a href="" class="text-decoration-none text-dark" style="font-weight: 500;">Contact</a>
            </div>

            <div class=" d-flex gap-4 me-3">
                <div id="currentuser" class="d-flex  align-items-center gap-4">
                </div>

                <button class="rounded-2" id="signOut"
                    style="background-color: black; color: white; border: none !important; padding: 5px 11px !important ;">Sign
                    Out</button>

            </div>


        </div>
    </header>

    <div class="p-3">
        <h1 id="greetings" class="ms-2" style="font-size: 25px;">WELCOME,</h1>

        <div class="d-flex justify-content-end pe-5">
            <button class="rounded-2" id="addProduct"
                style="background-color: black; color: white; border: none !important; padding: 5px 11px !important ;">Add
                Product</button>
        </div>

        <div id="messageAlert"></div>

        <div id="productForm"></div>


    </div>



    <div class="p-3">
        <div class="gap-3" id="productList"
            style=" display: flex !important; flex-wrap: wrap !important; justify-content: stretch; overflow: hidden !important; ">
        </div>


    </div>


    <script type="module">
        import User from "/User.js";
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";


        const firebaseConfig = {
            apiKey: "AIzaSyDtme28j9rc5NIbv7mHOSncV9W_6NlGWp4",
            authDomain: "chicmart-9c9f1.firebaseapp.com",
            databaseURL: "https://chicmart-9c9f1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "chicmart-9c9f1",
            storageBucket: "chicmart-9c9f1.firebasestorage.app",
            messagingSenderId: "860959606353",
            appId: "1:860959606353:web:0744c14db06445b109da70"
        };


        const app = initializeApp(firebaseConfig);

        const auth = getAuth();

        const db = getDatabase(app);

        let prodIndex = 0;


        // // CHECK USER LOGIN
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is signed in, see docs for a list of available properties
                // https://firebase.google.com/docs/reference/js/auth.user
                const uid = user.uid;

                console.log(uid);

                // ...
            } else {
                window.location.href = "/";
            }
        });

        // USER SIGNOUT
        document.getElementById("signOut").addEventListener("click", () => {
            signOut(auth).then(() => {
                alert("Signed out successfully");
                window.location.href = "/";
            }).catch((error) => {
                // An error happened.
                console.log(error);
                alert("Error signing out: " + error.message);
            });
        });


        // User account details
        let getUser = localStorage.getItem("user");
        let convertuser = JSON.parse(getUser);

        console.log(auth.currentUser);


        currentuser.innerHTML = `
                <div class="d-flex align-items-center  gap-2">
                    <div>
                        <img class="rounded-5" src="${convertuser.picture}" alt="Profile Picture" width="50" height="50">
                    </div>
                
                    <div>
                        <p class="fw-bold" style="font-weight:600 !important">Profile</p>
                    </div>
                </div>
                
            `
        greetings.innerHTML += `${convertuser.fullname || localUserSaved.firstName} `

        // SHOW PRODUCT FORM
        document.getElementById("addProduct").addEventListener("click", () => {

            productForm.innerHTML = `

                <form class="d-flex flex-column gap-2 ">

                    <input required id="productImage"type="text"placeholder="Product Image URL"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;" >
                 
                    <input required  id="productName" type="text"placeholder="Product Name"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">
                   
                    <input required  id="productPrice"type="text" placeholder="Product Price"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">

                    <input required id="productQuantity"type="number"placeholder="Product Quantity"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">

                   
                    <select required class="rouned-2"  name="" id="productCategory"  style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;">
                        <option value="">Select Category</option>
                         <option value="beauty">beuty</option>
                          <option value="furniture">furniture</option>
                           <option value="fragrances">fragrances</option>
                           <option value="groceries">groceries</option>
                           <option value="phone">phone</option>
                           <option value="laptop">laptop</option>
                    </select>

                    <textarea required  id="productDescription"placeholder="Product Description" style="border: 1px solid #E5E5E5; padding: 8px 12px !important; background-color: #F3F3F5; max-width: 200px; border-radius: 5px;"></textarea  >

                    <button id="saveProduct" style="background-color: black; color: white; border: none !important; padding: 5px 11px !important; max-width: 200px; border-radius: 5px;"> Save Product</button>

                </form>
            `;



            // SAVE PRODUCT
            document.getElementById("saveProduct").addEventListener("click", () => {



                // GET INPUT VALUES
                const imageValue = productImage.value.trim();
                const nameValue = productName.value.trim();
                const priceValue = productPrice.value.trim();
                const quantityValue = productQuantity.value.trim();
                const categoryValue = productCategory.value.trim();
                const descriptionValue = productDescription.value.trim();

                // VALIDATION
                if (
                    imageValue === "" ||
                    nameValue === "" ||
                    priceValue === "" ||
                    quantityValue === "" ||
                    categoryValue === "" ||
                    descriptionValue === ""
                ) {
                    alert("Please fill all product details");
                    return;
                }



                const dbRef = ref(db, `/products/${prodIndex}`);
                let productData = {

                    productImage: productImage.value,
                    productName: productName.value,
                    productPrice: productPrice.value,
                    productQuantity: productQuantity.value,
                    productCategory: productCategory.value,
                    productDescription: productDescription.value,
                    id: auth.currentUser.uid,
                    email: auth.currentUser.email,
                    name: auth.currentUser.displayName,
                    role: "seller"
                };

                // SAVE TO DATABASE
                set(dbRef, productData)
                    .then(() => {

                        // SUCCESS MESSAGE
                        const alertMe = document.getElementById("messageAlert");

                        alertMe.style.display = "block";

                        alertMe.innerHTML = `
                            <div class="alert alert-success text-center">
                                Product Saved Successfully!
                            </div>
                        `;

                       
                        setTimeout(() => {
                            alertMe.innerHTML = "";
                        }, 3000);

                        // COLLAPSE / REMOVE FORM
                        productForm.innerHTML = "";

                    })

                    .catch((error) => {
                        console.log(error);
                        alert("Error saving product");
                    });




            });


        });


        const dbRef = ref(db, "/products");
        let loadedProducts = [];

        onValue(dbRef, (snapshot) => {

            const data = snapshot.val();

            console.log(data);


            if (!data) {
                prodIndex = 0;
                productList.innerHTML = `
                    <h3>No products yet</h3>
                `;
                loadedProducts = [];
            } else {
                prodIndex = data.length;

                // Only render products that are new (not already in loadedProducts)
                let newProductsHTML = "";
                data.forEach((item, idx) => {
                    if (!item) return;
                    if (auth.currentUser && auth.currentUser.email == item.email) {
                        // Check if product already exists in DOM
                        if (idx >= loadedProducts.length) {
                            newProductsHTML += `

                        <div class="card" style="width: 250px">
                            <img src="${item.productImage}" class="card-img-top" alt="..." height="250"  style="object-fit: cover;">
                            <div class="card-body p-2" style="display:flex !important; flex-direction:column !important; ">
                                <h5 class="card-title">${item.productName}</h5>
                                <div class="d-flex justify-content-between align-items-center">
                                    <p>₦${item.productPrice}</p>
                                    <p>Qty:${item.productQuantity}</p>
                                </div>
                                <p class="card-text" style="flex: 1 !important">${item.productDescription}</p>
                                <div>
                                    <a id="" href="#" class="btn px-2 py-1 btn-primary">Edit</a>
                                    <a id="deleteItem" href="#" class="btn px-2 py-1 btn-danger">Delete</a>
                                </div>
                                
                            </div>
                        </div>
                    `;
                        }
                    }
                });

                // Append only new products instead of clearing and rebuilding all
                productList.innerHTML += newProductsHTML;
                loadedProducts = data;

            }

        });



    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
